<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate</title>

<style>
body{
    background:#f5f5f5;
    font-family:Georgia, serif;
    margin:0;
    padding:40px;
}

.certificate{
    max-width:900px;
    margin:auto;
    background:white;
    border:10px solid gold;
    padding:50px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1{
    font-size:48px;
    margin-bottom:10px;
}

h2{
    font-size:34px;
    color:#444;
}

.name{
    font-size:42px;
    margin:30px 0;
    font-weight:bold;
    color:#1a1a1a;
}

.quiz{
    font-size:30px;
    margin:20px 0;
}

.score{
    font-size:26px;
    margin:20px 0;
}

.footer{
    margin-top:60px;
    display:flex;
    justify-content:space-between;
}

button{
    margin-top:40px;
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="certificate">

    <h1>🏆</h1>

    <h2>CERTIFICATE OF ACHIEVEMENT</h2>

    <p>This certifies that</p>

    <div class="name" id="studentName"></div>

    <p>has successfully completed the</p>

    <div class="quiz" id="quizName"></div>

    <div class="score" id="scoreText"></div>

    <div class="footer">
        <div>
            Date<br>
            <span id="today"></span>
        </div>

        <div>
            Online Quiz System
        </div>
    </div>

    <button onclick="window.print()">
        Download / Print Certificate
    </button>

</div>

<script>

const cert =
JSON.parse(
sessionStorage.getItem("certificateData")
);

if(!cert){
    location.href="quizzes.html";
}

document.getElementById("studentName").textContent =
cert.name;

document.getElementById("quizName").textContent =
cert.quiz;

document.getElementById("scoreText").textContent =
`Score: ${cert.score}/${cert.total}
(${cert.percentage}%)`;

document.getElementById("today").textContent =
new Date().toLocaleDateString();

</script>

</body>
</html>
